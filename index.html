<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSeparator Pro</title>
    <style>
        :root {
            --bg-main: #081122;       
            --bg-panel: #11223A;      
            --azul-pastel: #8BA8CC;   
            --azul-claro: #B3CDE8;    
            --azul-oscuro: #3A5B80;   
            --texto: #F0F4F8;         
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--texto);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--bg-panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 700px;
        }

        h1 { color: var(--azul-pastel); text-align: center; margin-top: 0; font-size: 24px;}
        
        .upload-zone {
            border: 2px dashed var(--azul-pastel);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(139, 168, 204, 0.05);
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .upload-zone:hover { background: rgba(139, 168, 204, 0.15); border-color: var(--azul-claro);}

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--azul-claro); 
            margin-bottom: 6px;
        }

        select, input[type="number"] {
            padding: 10px;
            background-color: var(--bg-main);
            color: var(--texto);
            border: 1px solid var(--azul-oscuro);
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        select:focus, input:focus { border-color: var(--azul-pastel); }

        .full-width { grid-column: span 2; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        button.btn-primary {
            background-color: var(--azul-pastel);
            color: var(--bg-main);
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        button.btn-primary:hover { background-color: var(--azul-claro); }
        button.btn-primary:active { transform: scale(0.98); }

        #statusText {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--azul-pastel);
            display: none;
        }

        @media (max-width: 500px) {
            .config-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Separación de Audio Avanzada</h1>
        
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('audioInput').click()">
            <p id="uploadText">Sube o arrastra tu archivo de audio aquí</p>
            <span style="font-size: 12px; color: var(--azul-oscuro);">Formatos soportados: WAV, MP3, FLAC</span>
            <input type="file" id="audioInput" style="display:none" accept="audio/*">
        </div>

        <div class="config-grid">
            <div class="form-group full-width">
                <label>Modelo de Separación</label>
                <select id="modelSelect">
                    <option value="bs_roformer">BS-Roformer (Vocal e Instrumental)</option>
                    <option value="mdx23c">MDX23C (Demucs - 4 Stems)</option>
                    <option value="voc_gabox">voc_gaboxFv1 (Alta precisión vocal)</option>
                    <option value="mdx_extra">MDX-Net (Batería y Bajo)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tamaño de Segmento (Segment Size)</label>
                <select id="segmentSize">
                    <option value="256">256 (Más rápido)</option>
                    <option value="512">512</option>
                    <option value="1024" selected>1024 (Recomendado)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Superposición (Overlap)</label>
                <select id="overlap">
                    <option value="2">2</option>
                    <option value="4" selected>4 (Equilibrio)</option>
                    <option value="8">8 (Más calidad)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Formato de Salida</label>
                <select id="outFormat">
                    <option value="flac">FLAC</option>
                    <option value="wav" selected>WAV</option>
                    <option value="mp3">MP3</option>
                </select>
            </div>

            <div class="form-group">
                <label>Shifts (Pasadas)</label>
                <input type="number" id="shifts" value="0" min="0" max="10">
            </div>
        </div>

        <button class="btn-primary" onclick="iniciarSeparacion()">Procesar Audio</button>
        <p id="statusText">Conectando con el servidor...</p>
    </div>

    <script>
        const fileInput = document.getElementById('audioInput');
        const uploadText = document.getElementById('uploadText');

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                uploadText.innerText = "Archivo seleccionado: " + e.target.files[0].name;
            }
        });

        async function iniciarSeparacion() {
            if(fileInput.files.length === 0) {
                alert("Debes seleccionar un archivo de audio.");
                return;
            }

            const status = document.getElementById('statusText');
            status.style.display = 'block';
            status.innerText = 'Subiendo archivo y encolando tarea...';

            // Recopilar configuraciones
            const formData = new FormData();
            formData.append("audio", fileInput.files[0]);
            formData.append("model", document.getElementById('modelSelect').value);
            formData.append("segment_size", document.getElementById('segmentSize').value);
            formData.append("overlap", document.getElementById('overlap').value);
            formData.append("format", document.getElementById('outFormat').value);
            formData.append("shifts", document.getElementById('shifts').value);

            /* 
            AQUÍ VA LA CONEXIÓN AL BACKEND.
            Ejemplo de cómo será:
            
            try {
                const response = await fetch('URL_DE_TU_API_AQUI/separar', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                status.innerText = 'Proceso completado. Descargando...';
                // Lógica para descargar el ZIP que devuelva el servidor
            } catch (error) {
                status.innerText = 'Error en el servidor.';
                status.style.color = 'red';
            }
            */
        }
    </script>
</body>
</html>
